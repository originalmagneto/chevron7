<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="520" viewBox="0 0 1160 520" role="img" aria-labelledby="proc-title proc-desc">
  <title id="proc-title">Zaručená konverzia: pracovný tok a stav integrácie</title>
  <desc id="proc-desc">Päť krokov aplikácie od vstupu cez kontrolu a doložku po autorizáciu a výsledok. EZZK pridelí evidenčné číslo pri autorizácii a podpísaný záznam o konverzii sa sám odošle do CEZZK.</desc>
  <defs><marker id="proc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#4f5d75"/></marker></defs>
  <rect width="1160" height="520" fill="#f5f5f5"/>
  <text x="32" y="50" font-family="Georgia, serif" font-size="30" fill="#2d3142">Zaručená konverzia: od skenu po výsledok</text>
  <text x="32" y="80" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#4f5d75">Aktuálny krok sa zobrazuje v podnadpise okna.</text>
  <g fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#proc-arrow)">
    <path d="M232 208 H252"/><path d="M456 208 H476"/>
    <path d="M680 208 H700"/><path d="M904 208 H924"/>
    <path d="M804 356 V292"/>
    <path d="M1028 288 V352" stroke-dasharray="4 4"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif"><rect x="32" y="128" width="200" height="160" rx="8" fill="#ffffff" stroke="#b5bdc9"/>
    <text x="50" y="160" font-size="19" font-weight="600" fill="#2d3142">1 · Vstup</text>
    <text x="50" y="198" font-size="15" fill="#4f5d75">PDF alebo sken</text>
    <text x="50" y="224" font-size="15" fill="#4f5d75">Potvrdenie pôvodu</text>
    <text x="50" y="250" font-size="15" fill="#4f5d75">Analýza strán</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif"><rect x="256" y="128" width="200" height="160" rx="8" fill="#fff5ee" stroke="#eb6c36"/>
    <text x="274" y="160" font-size="19" font-weight="600" fill="#2d3142">2 · Overenie</text>
    <text x="274" y="198" font-size="15" fill="#4f5d75">AI návrhy + kontrola</text>
    <text x="274" y="224" font-size="15" fill="#4f5d75">16 druhov prvkov</text>
    <text x="274" y="250" font-size="15" fill="#4f5d75">Aj fyzický originál</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif"><rect x="480" y="128" width="200" height="160" rx="8" fill="#ffffff" stroke="#b5bdc9"/>
    <text x="498" y="160" font-size="19" font-weight="600" fill="#2d3142">3 · Doložka</text>
    <text x="498" y="198" font-size="15" fill="#4f5d75">Profil a počítadlá</text>
    <text x="498" y="224" font-size="15" fill="#4f5d75">Opis a poloha prvkov</text>
    <text x="498" y="250" font-size="15" fill="#4f5d75">Kontrola údajov</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif"><rect x="704" y="128" width="200" height="160" rx="8" fill="#ffffff" stroke="#b5bdc9"/>
    <text x="722" y="160" font-size="19" font-weight="600" fill="#2d3142">4 · Autorizácia</text>
    <text x="722" y="198" font-size="15" fill="#4f5d75">PDF/A + XML</text>
    <text x="722" y="224" font-size="15" fill="#4f5d75">Mandátny KEP + QTS</text>
    <text x="722" y="250" font-size="15" fill="#4f5d75">Karta s mandátom</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif"><rect x="928" y="128" width="200" height="160" rx="8" fill="#ffffff" stroke="#b5bdc9"/>
    <text x="946" y="160" font-size="19" font-weight="600" fill="#2d3142">5 · Hotovo</text>
    <text x="946" y="198" font-size="15" fill="#4f5d75">Kontajner pre klienta</text>
    <text x="946" y="224" font-size="15" fill="#4f5d75">Záznam v Registri</text>
    <text x="946" y="250" font-size="15" fill="#4f5d75">Náhľad a Finder</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="480" y="356" width="424" height="100" rx="8" fill="#eceff3" stroke="#b5bdc9"/>
    <text x="500" y="388" font-size="18" font-weight="600" fill="#2d3142">EZZK: evidenčné číslo a čas</text>
    <text x="500" y="414" font-size="15" fill="#4f5d75">Prihlásenie a dostupná služba sú podmienkou.</text>
    <text x="500" y="438" font-size="15" fill="#4f5d75">Číslo pridelí EZZK pri autorizácii.</text>
    <rect x="928" y="356" width="200" height="100" rx="8" fill="#eceff3" stroke="#b5bdc9"/>
    <text x="946" y="388" font-size="18" font-weight="600" fill="#2d3142">CEZZK</text>
    <text x="946" y="414" font-size="15" fill="#4f5d75">Záznam sa odošle sám,</text>
    <text x="946" y="438" font-size="15" fill="#4f5d75">stav ukáže Register.</text>
    <text x="32" y="492" font-size="14" fill="#4f5d75">Každá neprázdna strana vyžaduje ľudskú kontrolu. Formulárový balík zostáva pilotný.</text>
  </g>
</svg>
