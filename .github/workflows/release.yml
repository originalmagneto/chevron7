# Publishes a GitHub release for every push to main that carries a feat, fix or
# perf commit since the last native-v* tag. The version comes from those
# commits (Chevron7/scripts/next-version.sh); nothing is committed back.
# With the Developer ID secrets set, the app and the DMG are signed and
# notarized (Chevron7/docs/RELEASING.md); without them the release stays ad hoc.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (empty: derive it from the commits)"
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decide the version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version="${REQUESTED#v}"
          [[ -n "$version" ]] || version="$(Chevron7/scripts/next-version.sh)"
          if [[ -z "$version" ]]; then
            echo "No feat, fix or perf commit since the last release: nothing to publish."
          elif git rev-parse -q --verify "refs/tags/native-v$version" >/dev/null; then
            echo "native-v$version already exists: nothing to publish."
            version=""
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Decide whether to sign
        id: signing
        if: steps.version.outputs.version != ''
        env:
          P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set_names=()
          missing=()
          for name in P12 P12_PASSWORD API_KEY API_KEY_ID API_ISSUER; do
            if [[ -n "${!name}" ]]; then set_names+=("$name"); else missing+=("$name"); fi
          done
          if [[ ${#set_names[@]} -eq 0 ]]; then
            echo "::warning::No Developer ID secrets: this release is signed ad hoc and not notarized."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Incomplete Developer ID secrets, missing: ${missing[*]}"
            exit 1
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import the Developer ID identity and the notary key
        if: steps.signing.outputs.enabled == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          keychain="$RUNNER_TEMP/chevron7-signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          printf '%s' "$P12" | /usr/bin/base64 -D > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null

          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          [[ -n "$identity" ]] || { echo "Developer ID Application identity not found in the .p12" >&2; exit 1; }

          printf '%s' "$API_KEY" | /usr/bin/base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "CODE_SIGN_IDENTITY=$identity"
            echo "APPLE_API_KEY_FILE=$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_ID=$API_KEY_ID"
            echo "APPLE_API_ISSUER_ID=$API_ISSUER"
          } >> "$GITHUB_ENV"

      - name: Set up Azul Zulu FX 25
        if: steps.version.outputs.version != ''
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "25"
          java-package: jdk+fx
          architecture: aarch64
          cache: maven
          cache-dependency-path: engine/pom.xml

      - name: Build the signing engine
        if: steps.version.outputs.version != ''
        run: AUTOGRAM_JAVA_HOME="$JAVA_HOME" Chevron7/scripts/build-engine.sh

      - name: Build Chevron7.app
        if: steps.version.outputs.version != ''
        working-directory: Chevron7
        env:
          CHEVRON7_VERSION: ${{ steps.version.outputs.version }}
        run: |
          export DEVELOPER_DIR="$(xcode-select -p)"
          xcodebuild -version
          swift --version
          ./build_app.sh --release package

      - name: Sign and notarize Chevron7.app
        if: steps.signing.outputs.enabled == 'true'
        working-directory: Chevron7
        run: |
          app="$(swift build -c release --show-bin-path)/Chevron7.app"
          scripts/sign-release.sh "$app"
          scripts/notarize-release.sh "$app"

      - name: Package the DMG
        if: steps.version.outputs.version != ''
        run: Chevron7/scripts/package-release.sh "${{ steps.version.outputs.version }}" "$RUNNER_TEMP/dist"

      - name: Sign and notarize the DMG
        if: steps.signing.outputs.enabled == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dmg="$RUNNER_TEMP/dist/Chevron7-v$VERSION.dmg"
          codesign --force --timestamp --sign "$CODE_SIGN_IDENTITY" "$dmg"
          Chevron7/scripts/notarize-release.sh "$dmg"

      # The same DMG under a fixed name, so that
      # https://github.com/originalmagneto/chevron7/releases/latest/download/Chevron7.dmg
      # always downloads the newest release (the website links to it).
      - name: Add the latest-download copy
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd "$RUNNER_TEMP/dist"
          cp "Chevron7-v$VERSION.dmg" Chevron7.dmg
          shasum -a 256 "Chevron7-v$VERSION.dmg" Chevron7.dmg > SHA256SUMS.txt

      - name: Publish the release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          Chevron7/scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "native-v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "Chevron7 v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP/dist/Chevron7-v$VERSION.dmg" \
            "$RUNNER_TEMP/dist/Chevron7.dmg" \
            "$RUNNER_TEMP/dist/SHA256SUMS.txt"

      - name: Remove the signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"
          security delete-keychain "$RUNNER_TEMP/chevron7-signing.keychain-db" 2>/dev/null || true
