# Runs the signing engine's Java tests on every pull request and on main.
# qpdf is required here (AUTOGRAM_REQUIRE_QPDF=1), so the independent structure
# check of the PDFs the engine writes (QpdfCheck) cannot be skipped silently.
# The release workflow still builds the engine with -DskipTests.
name: Engine tests

on:
  pull_request:
    paths:
      - "engine/**"
      - ".github/workflows/engine-tests.yml"
  push:
    branches: [main]
    paths:
      - "engine/**"
      - ".github/workflows/engine-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up Azul Zulu FX 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "25"
          java-package: jdk+fx
          architecture: aarch64
          cache: maven
          cache-dependency-path: engine/pom.xml

      - name: Install qpdf
        run: |
          brew install qpdf
          qpdf --version | head -1

      - name: Run the engine tests
        working-directory: engine
        env:
          AUTOGRAM_REQUIRE_QPDF: "1"
        run: ./mvnw -B -Djlink.jdk.path="$JAVA_HOME" test

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engine-surefire-reports
          path: engine/target/surefire-reports
          retention-days: 7
